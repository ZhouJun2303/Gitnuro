[workspace]
resolver = "2"
members = ["src-tauri", "crates/git"]

# gitoxide hashes and decodes the index; unoptimized it makes status several times slower in `pnpm start`.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
