# GitHub retired the macOS 14 runner image on 2026-11-02, so macOS builds run
# on macos-15. A full NSIS or signed package needs secrets and is not run on
# every pull request. `cargo check -p awegit` is the packaging smoke test.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/check-versions.mjs
      - run: node scripts/test-all.mjs
      - name: package smoke
        run: cargo check -p awegit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: install Playwright Chromium
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      - run: pnpm test:ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-logs
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
