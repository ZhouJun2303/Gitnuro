[package]
name = "awegit"
version = "2.0.4"
description = "AweGit desktop shell"
edition = "2021"
# Two bins exist (`awegit` shell, `awegit-lab` harness). `tauri dev` runs a
# bare `cargo run`, which fails without a default. The lab is started
# explicitly through `--bin awegit-lab` in scripts/lab-serve.mjs.
default-run = "awegit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "awegit_lib"
# Desktop links this rlib into the exe. A cdylib exports every symbol, and
# GNU ld rejects that table once it passes 65535 ordinals.
crate-type = ["rlib"]

[[bin]]
name = "awegit"
path = "src/main.rs"

[[bin]]
name = "awegit-lab"
path = "src/bin/lab.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `native-tls` alone does not install a default connector; `tls` + `native-certs`
# uses rustls with the OS trust store so HTTPS update checks work on Windows.
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "gzip", "socks-proxy"] }
sha2 = "0.10"
awegit-git = { path = "../crates/git" }
