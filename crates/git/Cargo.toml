[package]
name = "awegit-git"
version = "2.0.5"
edition = "2021"
description = "Git status, diff, and index changes for AweGit"

[dependencies]
gix = { version = "0.73", default-features = false, features = ["status", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
